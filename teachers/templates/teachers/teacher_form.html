{% extends "base.html" %} 
  
{% block title %}{{ title }} · School Manager{% endblock %} 
  
{% block content %} 
    <h1>{{ title }}</h1> 
    <form method="post"> 
        {% csrf_token %} 
        {% for field in form %} 
            <div class="field"> 
                {{ field.label_tag }} {{ field }} {{ field.errors }} 
            </div> 
        {% endfor %} 
        <button type="submit">Enregistrer</button> 
        <a href="{% url 'teachers:list' %}">Annuler</a> 
    </form> 
{% endblock %}
